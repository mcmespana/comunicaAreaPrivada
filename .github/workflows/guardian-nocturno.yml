name: Guardián Nocturno del CRM

# Cada noche pasa por SinergiaCRM, hace el mantenimiento que el área privada no
# puede permitirse en caliente, y canta si algo va mal.
#
# Hoy: recuentos y monitores de cada grupo, y revisión de los datos que rompen
# Pasar Lista. Para añadir tareas, mira la cabecera de
# .github/scripts/guardian/guardian.mjs — está pensado para crecer.
#
# ── Dos modos, y por qué ─────────────────────────────────────────────────────
# COMPLETO (viernes y sábado de madrugada): recalcula los ~105 grupos, una
#   llamada por grupo. Es el único modo que se entera de una relación BORRADA:
#   el API excluye los borrados de cualquier consulta, así que si una relación
#   desaparece no hay forma de saber a qué grupo pertenecía — solo recontando
#   el grupo entero sale el número bueno.
# SUAVE (el resto de las noches): pide en UNA consulta las relaciones tocadas
#   en los últimos días y recalcula solo esos grupos. Dos o tres llamadas en
#   vez de cien, pero ciego a los borrados y a una vigencia que caduca sola
#   (un `end_date` que llega no modifica el registro).
# El completo del viernes y del sábado es la red que recoge lo que el suave no
# puede ver, y cae justo antes del sábado, que es cuando se miran los números.
# El día se decide EN MADRID, no en UTC.
#
# ── UN solo cron, y sin guarda de la hora ────────────────────────────────────
# 00:30 UTC: la 01:30 de Madrid en invierno y las 02:30 en verano. Esa hora que
# baila se acepta — de madrugada no hay nadie esperando.
#
# Antes había dos crons (23:30 y 00:30 UTC) para clavar la 1:30 todo el año, y
# el script descartaba el que no cayera cerca. Eso solo puede hacer daño: los
# crons de Actions llegan tarde (en cumples-monitores se vieron 21-27 minutos de
# retraso tres días seguidos), y con retraso suficiente se descartan las DOS
# ejecuciones y la noche se salta entera, con el job en verde. Con un cron no
# hay nada que descartar y un retraso solo hace que pase más tarde esa noche.
#
# Un efecto bueno de elegir 00:30 UTC: en las dos estaciones cae en el MISMO día
# de calendario que en Madrid (01:30 y 02:30 de la madrugada), así que el día que
# ve la lógica de suave/completo es el mismo que pone el cron. Con las 23:30 UTC
# no era así — en UTC era jueves y aquí ya viernes.
#
# ── Cómo canta si falla ──────────────────────────────────────────────────────
#   1. El job sale ROJO y GitHub manda su propio correo al dueño del repo
#      (Settings → Notifications → "Actions"), que es el aviso que no depende
#      de que hayamos configurado nada.
#   2. El resumen de la ejecución lleva el informe entero en una tabla: se abre
#      la ejecución y se ve qué pasó sin bucear en el log.
#   3. Si están puestos los secretos RESEND_API_KEY y GUARDIAN_AVISOS_TO, manda
#      un correo con el informe. Solo cuando hay algo que contar: un correo
#      diario diciendo "todo bien" se deja de leer en una semana, y entonces el
#      que importa también se pierde.
#   4. El informe crudo queda como artefacto 30 días.
#
# ⚠️ GitHub DESACTIVA los crons de un repo sin actividad durante 60 días y avisa
# por correo. Si el guardián deja de pasar sin más, mira eso primero.

on:
  schedule:
    - cron: '30 0 * * *'    # 01:30 en Madrid en invierno, 02:30 en verano. Da igual: pasa.
  workflow_dispatch:
    inputs:
      modo:
        description: 'Completa (segura, recalcula todo) o suave (solo lo que ha cambiado).'
        type: choice
        required: false
        default: 'full'
        options: ['full', 'soft', 'auto']
      tareas:
        description: 'Tareas a ejecutar (claves separadas por comas). Vacío = todas.'
        required: false
        default: ''
      dry_run:
        description: 'Consultar y calcular, pero NO escribir en el CRM.'
        type: boolean
        required: false
        default: false
      avisar_siempre:
        description: 'Mandar el correo aunque todo haya ido bien.'
        type: boolean
        required: false
        default: false

# Que dos pasadas no se pisen escribiendo los mismos grupos.
concurrency:
  group: guardian-nocturno
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guardia:
    name: Pasar por el CRM
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      # El runner ya trae Node 20; se fija para que no cambie sin avisar.
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Antes de tocar el CRM: si la lógica está rota, mejor no escribir nada.
      # Se apunta al fichero y no a la carpeta porque la forma con carpeta no se
      # resuelve igual en todas las versiones de Node.
      - name: Tests de la lógica
        run: node --test .github/scripts/guardian/guardian.test.mjs

      - name: Guardia
        env:
          CRM_URL: ${{ secrets.CRM_URL }}
          CRM_CLIENT_ID: ${{ secrets.CRM_CLIENT_ID }}
          CRM_CLIENT_SECRET: ${{ secrets.CRM_CLIENT_SECRET }}
          # Opcionales: sin ellos no se manda correo, y el informe lo dice en
          # claro en vez de dejar creer que salió.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GUARDIAN_AVISOS_TO: ${{ secrets.GUARDIAN_AVISOS_TO }}
          GUARDIAN_FROM: ${{ secrets.GUARDIAN_FROM }}
          # Lo que viene del formulario se pasa por el entorno, NUNCA
          # interpolado en el shell: así un valor con comillas o con `;` no
          # puede acabar ejecutándose como comando.
          IN_TAREAS: ${{ inputs.tareas }}
          IN_MODO: ${{ inputs.modo }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_AVISAR_SIEMPRE: ${{ inputs.avisar_siempre }}
        run: |
          set -euo pipefail
          args=()
          # Ojo: aquí no vale `[ -n "$X" ] && args+=(...)`. Con `set -e`, la
          # línea entera devuelve 1 cuando la condición es falsa y el job
          # abortaría. Con `if` no pasa.
          if [ -n "${IN_TAREAS:-}" ]; then args+=("--tareas=$IN_TAREAS"); fi
          # En cron `inputs.modo` viene vacío y no se pasa nada: el script decide
          # por el día de la semana (completo viernes y sábado, suave el resto).
          # A mano llega siempre relleno, y por defecto es la completa.
          if [ -n "${IN_MODO:-}" ]; then args+=("--modo=$IN_MODO"); fi
          if [ "${IN_DRY_RUN:-}" = "true" ]; then args+=("--dry-run"); fi
          if [ "${IN_AVISAR_SIEMPRE:-}" = "true" ]; then args+=("--avisar-siempre"); fi
          node .github/scripts/guardian/guardian.mjs ${args[@]+"${args[@]}"}

      # El informe crudo, para poder mirar con calma qué grupo cambió. Se sube
      # siempre: cuando falla es cuando más falta hace.
      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-informe
          path: .github/scripts/guardian/informe-ultimo.json
          if-no-files-found: ignore
          retention-days: 30
