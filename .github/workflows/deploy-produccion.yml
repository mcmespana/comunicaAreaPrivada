name: Deploy a producción (comunica.movimientoconsolacion.com)

# Se ejecuta cuando se hace push a la rama de producción (`production`).
# Mergear una Pull Request ahí cuenta como push -> dispara el deploy.
# (Antes también escuchaba `produccion`, pero tener dos ramas de producción
# provocaba despliegues duplicados; se dejó UNA sola: `production`.)
# También se puede lanzar a mano desde la pestaña Actions (workflow_dispatch).

on:
  push:
    branches:
      - production
  workflow_dispatch: {}

# Evita que dos despliegues se pisen si se mergea varias veces seguidas.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  # Puerta de calidad (plan 013): lint de todo el PHP + PHPUnit. Si algo falla,
  # el deploy NO se ejecuta (el job deploy declara `needs: test`).
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4
      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Validar composer.json
        run: composer validate --no-check-publish --no-check-all
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint de todos los .php del plugin
        run: composer run lint
      - name: PHPUnit
        run: composer test

  deploy:
    name: Subir plugin por FTPS
    needs: test          # el deploy espera a que la puerta de calidad pase
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      # El área son recargas completas de página, así que el navegador vuelve a
      # PARSEAR todo el CSS en cada tap (la caché ahorra la descarga, no el
      # parseo). Se minifica aquí, sobre la copia del runner: el repositorio
      # conserva los fuentes comentados y producción recibe ~146 KB menos.
      #
      # Solo --minify-whitespace (comentarios + espacios), NO --minify: el
      # minificado completo reescribe reglas, y este CSS tiene 726 !important
      # portantes y una cascada delicada (ver plans/018-css-consolidation.md).
      # En JS evita además renombrar identificadores, y hay funciones globales
      # (confirmDelete, verifyIban, getCurrentDateTime…) invocadas por nombre
      # desde atributos HTML generados en PHP.
      - name: Preparar Node (para minificar assets)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Minificar CSS y JS propios (solo en lo que se sube)
        run: |
          set -euo pipefail
          # Pasar Lista entró después de escribirse este paso y se quedó fuera de la
          # lista: 124 KB de CSS y 56 KB de JS viajaban con todos sus comentarios
          # justo a las pantallas que se usan en un patio, con datos móviles.
          # No se mete `js/stic-pasar-lista-sw.js`: son 7 KB y un service worker
          # tiene su propia semántica de actualización; no compensa el riesgo.
          for f in css/custom-style.css css/stic-base.css css/pasar-lista.css \
                   js/stic-ui.js js/stic-utils.js js/stic-init.js js/stic-cropper.js \
                   js/stic-pasar-lista.js; do
            before=$(wc -c < "$f")
            npx --yes esbuild "$f" --minify-whitespace --allow-overwrite --outfile="$f"
            echo "$f: $before -> $(wc -c < "$f") bytes"
          done

      - name: Subir el plugin por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # --- Conexión (se rellenan con los Secrets del repositorio) ---
          server: ${{ secrets.FTP_SERVER }}        # ej. ftp.movimientoconsolacion.com
          username: ${{ secrets.FTP_USERNAME }}    # usuario FTP del hosting
          password: ${{ secrets.FTP_PASSWORD }}    # contraseña FTP
          protocol: ftps                           # FTP cifrado con TLS (puerto 21)
          port: 21

          # --- Destino: carpeta del plugin en el servidor (DEBE acabar en "/") ---
          # ej. /public_html/wp-content/plugins/sinergiacrm-private-area/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

          # No borra el destino entero: sube solo lo que ha cambiado (incremental).
          dangerous-clean-slate: false

          # Archivos que NO se suben al servidor (solo son de desarrollo).
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/*.md
            **/*.backup
            **/*.html
            **/.gitignore
            **/.DS_Store
            **/.agents/**
            **/.claude/**
            **/plans/**
            **/vendor/**
            **/tests/**
            **/node_modules/**
            **/.phpunit.cache/**
            **/composer.json
            **/composer.lock
            **/phpunit.xml.dist
            **/skills-lock.json

# ──────────────────────────────────────────────────────────────────────────────
# ¿Tu acceso es SFTP de verdad (puerto 22, basado en SSH) y NO FTPS (puerto 21)?
# Entonces sustituye el paso "Subir el plugin por FTPS" por este otro y crea los
# secretos SFTP_* en vez de FTP_* (ver docs/despliegue.md):
#
#       - name: Subir el plugin por SFTP
#         uses: wlixcc/SFTP-Deploy-Action@v1.2.6
#         with:
#           server: ${{ secrets.SFTP_SERVER }}
#           username: ${{ secrets.SFTP_USERNAME }}
#           ssh_private_key: ${{ secrets.SFTP_PRIVATE_KEY }}
#           port: 22
#           local_path: './*'
#           remote_path: ${{ secrets.SFTP_REMOTE_DIR }}
#           sftp_only: true
#           exclude_list: '.git*,.github,docs,*.md,*.backup'
